androidComponents {
    onVariants(selector().withFlavor("distribution", "nonPlay")) { variant ->
        def capitalizedVariantName = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
        def versionNameProvider = variant.outputs[0].versionName.map { it ?: "0" }
        def versionCodeProvider = variant.outputs[0].versionCode.map { Integer value -> (value ?: 0) as Long }
        def splitBaseUrlProvider = providers.gradleProperty("nonPlaySplitBaseUrl")
                .orElse(providers.environmentVariable("NON_PLAY_SPLIT_BASE_URL"))
                .orElse("https://cdn.example.com/android/${variant.name}")
        def sdkDir = providers.gradleProperty("android.injected.sdk.dir")
                .orElse(providers.environmentVariable("ANDROID_SDK_ROOT"))
                .orElse(providers.environmentVariable("ANDROID_HOME"))
                .orElse("${System.properties['user.home']}/Library/Android/sdk")
                .get()
        def buildToolsDir = new File(sdkDir, "build-tools")
        def aapt2Binary = buildToolsDir.exists()
                ? project.fileTree(buildToolsDir).matching { include("**/aapt2") }.files.sort { it.absolutePath }.last()
                : null

        if (aapt2Binary == null || !aapt2Binary.exists()) {
            throw new GradleException("Unable to locate aapt2 under Android SDK: ${buildToolsDir.absolutePath}")
        }

        def generateTask = tasks.register(
                "generate${capitalizedVariantName}NonPlaySplitArtifacts",
                GenerateNonPlaySplitArtifactsTask,
        ) { task ->
            task.group = "distribution"
            task.description = "Exports split APKs and generated Qigsaw metadata for ${variant.name}."
            task.bundleFile.set(variant.artifacts.get(SingleArtifact.BUNDLE.INSTANCE))
            task.bundletoolClasspath.from(configurations.bundletoolCli)
            task.modulesJson.set(JsonOutput.toJson(nonPlayDynamicModules))
            task.applicationIdValue.set(variant.applicationId)
            task.versionNameValue.set(versionNameProvider)
            task.versionCodeValue.set(versionCodeProvider)
            task.minSdkValue.set(variant.minSdk.apiLevel)
            task.splitBaseUrl.set(splitBaseUrlProvider)
            task.keystorePath.set(rootProject.file(rootProject.storeFilePath).absolutePath)
            task.keystorePassword.set(rootProject.storePassword)
            task.keyAliasValue.set(rootProject.keyAlias)
            task.keyPasswordValue.set(rootProject.keyPassword)
            task.aapt2Path.set(aapt2Binary.absolutePath)
            task.assetsOutputDir.set(layout.projectDirectory.dir("src/${variant.name}/assets"))
            task.exportOutputDir.set(layout.buildDirectory.dir("outputs/nonplay-export/${variant.name}"))
        }

        tasks.register("export${capitalizedVariantName}NonPlaySplits") {
            group = "distribution"
            description = "Builds split APKs, refreshes ${variant.name} runtime assets, and exports CDN-ready artifacts."
            dependsOn(generateTask)
        }
    }
}
